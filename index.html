// ─── RSS FETCH ────────────────────────────────────────────────────────────────

async function tryFetchRSS(show) {
  const proxies = [
    `https://api.allorigins.win/get?url=${encodeURIComponent(show.rss)}`,
    `https://corsproxy.io/?${encodeURIComponent(show.rss)}`,
  ];
  for (const proxy of proxies) {
    try {
      const res = await fetch(proxy, { signal: AbortSignal.timeout(6000) });
      if (!res.ok) continue;
      const data = await res.json().catch(() => null);
      const xmlText = data ? (data.contents || "") : await res.text();
      if (!xmlText) continue;
      const xml = new DOMParser().parseFromString(xmlText, "text/xml");
      const item = xml.querySelector("item");
      if (!item) continue;
      const title = item.querySelector("title")?.textContent?.trim() || "";
      const rawDesc = item.querySelector("description")?.textContent || item.querySelector("summary")?.textContent || "";
      const tmp = document.createElement("div"); tmp.innerHTML = rawDesc;
      const desc = (tmp.textContent || "").trim().slice(0, 420) + "…";
      const pubDate = item.querySelector("pubDate")?.textContent || "";
      const date = pubDate ? new Date(pubDate).toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" }) : "";
      const dur = item.querySelector("duration")?.textContent?.trim() || "";
      const epUrl = item.querySelector("link")?.textContent || show.url;
      if (title) return { title, desc, date, dur, epUrl };
    } catch(e) { continue; }
  }
  return null;
}

// ─── AI SUMMARY ───────────────────────────────────────────────────────────────

async function getSummary(ep) {
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: `You are an expert podcast summariser for a professional in digital analytics, marketing, entrepreneurship, and building startups. Return ONLY valid JSON (no markdown, no extra text) with these exact keys:
- "hook": one punchy sentence (max 18 words) that makes someone want to listen immediately
- "summary": 3-4 sentences covering core ideas, specific frameworks or stories mentioned, and the main argument
- "takeaways": array of exactly 3 takeaways — specific, actionable, max 16 words each
- "whoFor": one sentence on exactly who will get the most from this episode
- "skipIf": one honest sentence on who can safely skip this one`,
        messages: [{ role: "user", content: `Podcast: ${ep.show}\nEpisode: ${ep.title}\nDescription: ${ep.desc}` }],
      }),
    });
    const data = await res.json();
    const text = data.content?.[0]?.text || "";
    return JSON.parse(text.replace(/```json|```/g, "").trim());
  } catch(e) {
    return {
      hook: "A strong episode worth your time.",
      summary: ep.desc,
      takeaways: ["Practical insights relevant to your work in analytics and marketing", "Frameworks you can apply to your own projects immediately", "Perspectives from experienced practitioners in the field"],
      whoFor: `Anyone working in ${ep.topic === "startup" ? "entrepreneurship and startups" : "analytics and AI"}.`,
      skipIf: "You are already deeply familiar with the core concepts covered.",
    };
  }
}

function App() {

  const [tab, setTab]             = useState("daily");
  const [statuses, setStatuses]   = useState({});

  const loadShows = useCallback(async (shows, setter) => {
    const results = await Promise.allSettled(shows.map(s => tryFetchRSS(s)));
    const eps = []; const sts = {};
    results.forEach((r, i) => {
      const s = shows[i];
      if (r.status === "fulfilled" && r.value) {
        eps.push({ ...s, ...r.value }); sts[s.name] = "live";
      } else {
        const fb = FALLBACK[s.name];
        if (fb) eps.push({ ...s, ...fb });
        sts[s.name] = "cached";
      }
    });
    setter(eps); setStatuses(st => ({ ...st, ...sts }));
  }, []);

  useEffect(() => {
    setLoading(true);
    Promise.all([loadShows(DAILY_SHOWS, setDailyEps), loadShows(WEEKLY_SHOWS, setWeeklyEps)])
      .finally(() => setLoading(false));

                  <div style={{ flex:1, height:1, background:"#e8e3dc" }} />
                </div>

                {topPick && <EpisodeCard ep={topPick} isTop={true} index={0} summaryCache={summaryCache} setSummaryCache={setSummaryCache} />}
                {rest.map((ep,i) => <EpisodeCard key={ep.show} ep={ep} isTop={false} index={i+1} summaryCache={summaryCache} setSummaryCache={setSummaryCache} />)}

                {/* Source statuses */}
                <div style={{ marginTop:16, paddingTop:16, borderTop:"1px solid #e8e3dc" }}>
                  <div style={{ fontSize:10, color:"#c0b8b0", textTransform:"uppercase", letterSpacing:1, marginBottom:8 }}>Feed Sources</div>
                  <div style={{ display:"flex", flexWrap:"wrap", gap:10 }}>
                    {currentShows.map(s => (
                      <div key={s.name} style={{ display:"flex", alignItems:"center", gap:5, fontSize:11, color:"#aaa" }}>
                        <Dot on={statuses[s.name]==="live"} />
                        {s.name}
                        <span style={{ fontSize:10, color: statuses[s.name]==="live"?"#2a6b5c":"#c8420a" }}>
                          {statuses[s.name]==="live" ? "live" : "cached"}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </>
        )}

        {/* Must-Listen */}
        {tab === "must" && (
          <div>
            <div style={{ background:"#fff8f0", border:"1px solid #fde8cc", borderRadius:12, padding:"14px 16px", fontSize:13, color:"#8a5a2a", lineHeight:1.7, marginBottom:20 }}>
              <strong style={{ display:"block", marginBottom:4, fontSize:11, textTransform:"uppercase", letterSpacing:"0.5px" }}>📌 Curated for your exact field</strong>
              These 6 shows are picked specifically for your background in digital analytics, marketing, entrepreneurship, and building SoulSpace Kit. Not generic — these are what practitioners in your world actually listen to.
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
              {MUST_LISTENS.map(item => <MustCard key={item.name} item={item} />)}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
